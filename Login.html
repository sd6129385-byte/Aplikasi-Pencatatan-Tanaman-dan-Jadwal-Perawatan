<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background-color: lightblue;
        }

        .login-container {
            max-width: 500px;
            margin: auto;
            margin-top: 100px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .profil img {
            width: 155px;
            height: 155px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto;
        }
        .login-container h2 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
  <div class="login-container">
    <form id="loginForm">
        <section class="profil">
          <img src="Logo.png" width="125" height="125" alt="Foto profil">

        <h4 style="text-align: center;">
          Pencatatan Tanaman dan Jadwal Perawatan
        </h4>

          <hr>

        <p class="mb-0">Login</p>
        <h6 class="mb-5">Masuk untuk mengakses akun anda</h6>
      </section>

      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fas fa-user"></i>
          </span>
          <input 
          type="text" 
          class="form-control" 
          id="username" 
          placeholder="Masukkan username" 
          required
          >
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fas fa-lock"></i>
          </span>
          <input 
          type="password" 
          class="form-control" 
          id="password" 
          placeholder="Masukkan password" 
          required
          >
        </div>
      </div>

      <p class="text-end mt-3">
      <a href="#" class="link-primary">Lupa Password?</a>
    </p>
      <button type="submit" class="btn btn-primary w-100" a href="Dashboard.html">
        Masuk
      </button>
    </form>
  </div>
<script>
  document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === "Satria Daffa" && password === "160407") {
      alert("Login berhasil!");

      window.location.href = "Dashboard.html";
    } else {
      alert("Username atau password salah!");
    }
  });
</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
